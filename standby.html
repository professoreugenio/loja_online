<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,
                 initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>
        Site temporariamente indisponível
    </title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f6f9;
            color: #212529;
        }

        .standby {
            width: min(92%,
                    620px);
            padding: 48px 32px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow:
                0 15px 45px rgba(0,
                    0,
                    0,
                    .08);
        }

        .icone {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            line-height: 1.6;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <main class="standby">
        <div class="icone" aria-hidden="true">
            🛠️
        </div>
        <h1>
            Estamos preparando
            novidades
        </h1>
        <p>
            Nossa loja está
            temporariamente em Standby.
            Retorne em breve.
        </p>
    </main>
</body>

</html>
